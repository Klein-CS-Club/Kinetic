<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101411"><title>Kinetic — Project Universe</title><link rel="stylesheet" href="atlas.css"><link rel="icon" href="assets/mark.svg"></head><body>
<a class="sig" href="#" aria-label="Kinetic home"><img src="assets/mark.svg" alt=""><span>Kinetic</span></a><button class="menuKey" aria-label="Open navigation" aria-controls="navigation" aria-expanded="false">Menu <i>☰</i></button><nav id="navigation" hidden><a href="#">Flight</a><a href="#explore">Workspace</a></nav>
